worker_processes auto;
pid /tmp/clb_nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_body_temp_path /tmp/clb_cliente;
    proxy_temp_path /tmp/clb_proxy;
    fastcgi_temp_path /tmp/clb_fastcgi;
    uwsgi_temp_path /tmp/clb_uwsgi;
    scgi_temp_path /tmp/clb_scgi;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Resuelve el servicio de Compose otra vez si se recrea el backend.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $inventario http://inventario:8000;

        location /api/ {
            proxy_pass $inventario$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        # Permite nuevas versiones del Service Worker y del manifiesto Angular.
        location = /ngsw-worker.js {
            add_header Cache-Control "no-cache";
        }

        location = /ngsw.json {
            add_header Cache-Control "no-cache";
        }

        location ~ \. {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        # Las rutas Angular se abren directamente, incluso en detalle/favoritos.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
