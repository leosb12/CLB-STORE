worker_processes auto;
pid /tmp/clb_nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_body_temp_path /tmp/clb_cliente;
    proxy_temp_path /tmp/clb_proxy;
    fastcgi_temp_path /tmp/clb_fastcgi;
    uwsgi_temp_path /tmp/clb_uwsgi;
    scgi_temp_path /tmp/clb_scgi;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;

        # Toda la API entra por la pasarela (punto único de entrada); se resuelve otra vez si se recrea.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $pasarela http://pasarela:8080;
        set $probador http://probador:8080;

        location ^~ /api/ {
            proxy_pass $pasarela$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            # La SAGA de compra en Ventas es síncrona y puede reintentar participantes; las misiones de los agentes
            # de IA tardan más (la pasarela les da 300 s) y la voz sube audio.
            proxy_read_timeout 300s;
            client_max_body_size 18m;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/cabeceras-seguridad.conf;
        }

        # Microfrontend del probador (React, contenedor propio): mismo origen, así lo cubren la CSP y el Service Worker.
        location ^~ /probador/ {
            proxy_pass $probador$uri;
            proxy_connect_timeout 5s;
            # Contenedor caído: se corta la conexión (444) en vez de responder 502, así el Service Worker usa su copia.
            proxy_intercept_errors on;
            error_page 502 503 504 = @probador_caido;
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Content-Type-Options;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/cabeceras-seguridad.conf;
        }

        location @probador_caido {
            return 444;
        }

        # `/probador` (sin barra) es la ruta Angular del probador. Sin esta location exacta, nginx respondería 301 hacia
        # `/probador/` (los archivos del microfrontend) por la `location ^~ /probador/` con proxy_pass.
        location = /probador {
            try_files /index.html =404;
            add_header Cache-Control "no-cache";
            include /etc/nginx/cabeceras-seguridad.conf;
        }

        # Permite nuevas versiones del Service Worker y del manifiesto Angular.
        location = /ngsw-worker.js {
            add_header Cache-Control "no-cache";
            include /etc/nginx/cabeceras-seguridad.conf;
        }

        location = /ngsw.json {
            add_header Cache-Control "no-cache";
            include /etc/nginx/cabeceras-seguridad.conf;
        }

        location ~ \. {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
            include /etc/nginx/cabeceras-seguridad.conf;
        }

        # Las rutas Angular se abren directamente, incluso en detalle/favoritos.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
            include /etc/nginx/cabeceras-seguridad.conf;
        }
    }
}
