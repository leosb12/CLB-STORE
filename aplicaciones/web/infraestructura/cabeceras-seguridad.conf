# Cabeceras de seguridad de la web (se incluyen en cada location porque un add_header local reemplaza los heredados).
# CSP: solo recursos propios; las llamadas salen a la propia API (/api) y a Keycloak por la pasarela (login PKCE y token).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: http://127.0.0.1:18000; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# Cámara solo para el probador y micrófono solo para la voz del panel, ambos en este origen; nada más.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=(), serial=(), display-capture=()" always;
