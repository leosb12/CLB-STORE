name: clb_store
description: "CLB Store para Android: catálogo y carrito sin conexión, compra idempotente, probador con TensorFlow Lite y SSO."
publish_to: 'none'
version: 1.0.9+10

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.6
  http: ^1.6.0
  sqflite: ^2.4.2+1
  path: ^1.9.1
  flutter_appauth: ^12.1.0
  flutter_secure_storage: ^11.2.0
  tflite_flutter: ^0.12.1
  image_picker: ^1.2.4
  image: ^4.12.0
  flutter_svg: ^2.3.0
  connectivity_plus: ^7.3.2
  webview_flutter: ^4.14.1
  permission_handler: ^12.0.1
  webview_flutter_android: ^4.12.0
  share_plus: ^13.3.1
  record: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/modelos/
    - assets/ilustraciones/
    - assets/prendas/
    # RA 3D: microfrontend React y BlazePose copiados por preparar-probador.ps1 (generados, no versionados).
    - assets/probador-host/
    - assets/probador/
    - assets/probador/assets/
    - assets/probador/prendas/
    - assets/probador/modelos/blazepose-3d/detector/
    - assets/probador/modelos/blazepose-3d/landmark-full/
    - assets/probador/modelos/blazepose-3d/landmark-lite/
  # Gelasio (SIL OFL 1.1), métricamente compatible con Georgia: la serif de títulos de la tienda web.
  fonts:
    - family: Gelasio
      fonts:
        - asset: assets/fuentes/Gelasio.ttf
