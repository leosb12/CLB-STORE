worker_processes auto;
pid /tmp/clb_nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_body_temp_path /tmp/clb_cliente;
    proxy_temp_path /tmp/clb_proxy;
    fastcgi_temp_path /tmp/clb_fastcgi;
    uwsgi_temp_path /tmp/clb_uwsgi;
    scgi_temp_path /tmp/clb_scgi;

    # Solo archivos estáticos (módulo ES, modelo MoveNet y manifiesto). El shell los publica en su origen bajo /probador/.
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        server_tokens off;

        location /probador/ {
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            return 404;
        }
    }
}
