spring.application.name=clb-ventas
server.port=${CLB_VENTAS_PUERTO_INTERNO:8080}
spring.main.banner-mode=off
# Errores propios en español; Spring no agrega su página de error.
server.error.whitelabel.enabled=false
spring.mvc.problemdetails.enabled=false

spring.datasource.url=jdbc:postgresql://${CLB_POSTGRES_SERVIDOR:127.0.0.1}:${CLB_POSTGRES_PUERTO:5433}/${CLB_POSTGRES_BASE:clb_ventas}${CLB_POSTGRES_PARAMETROS:}
spring.datasource.username=${CLB_POSTGRES_USUARIO:clb_ventas}
spring.datasource.password=${CLB_POSTGRES_CLAVE:}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.locations=classpath:db/migration

clb.inventario.url=${CLB_INVENTARIO_URL:http://127.0.0.1:18080}
clb.clientes.url=${CLB_CLIENTES_URL:http://127.0.0.1:18091}
# Identidad (Keycloak): emisor público estable (por la pasarela) y JWKS/token por la red interna.
clb.identidad.emisor=${CLB_IDENTIDAD_EMISOR:http://127.0.0.1:18000/identidad/realms/clb}
clb.identidad.interno=${CLB_IDENTIDAD_INTERNO:http://127.0.0.1:18000/identidad}
clb.identidad.jwks=${clb.identidad.interno}/realms/clb/protocol/openid-connect/certs
clb.identidad.token=/realms/clb/protocol/openid-connect/token
clb.identidad.cliente=${CLB_IDENTIDAD_CLIENTE:clb-ventas}
clb.identidad.secreto=${CLB_IDENTIDAD_SECRETO_VENTAS:}
clb.saga.intentos=${CLB_SAGA_INTENTOS:3}
clb.saga.espera-ms=${CLB_SAGA_ESPERA_MS:300}
clb.saga.reanudar-cada-ms=${CLB_SAGA_REANUDAR_MS:5000}
