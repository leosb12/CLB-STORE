worker_processes auto;
pid /tmp/clb_pasarela.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

# Punto único de entrada de CLB Store: la web, Android y las herramientas entran solo por aquí (los microservicios no
# publican puertos propios). Enruta por prefijo hacia cada microservicio y hacia Keycloak. No valida tokens: cada servicio
# los valida (defensa en profundidad), así un servicio nunca confía en que la pasarela filtró por él.
http {
    map $http_origin $clb_origen_probador {
        default "";
        ~^http://(127\.0\.0\.1|localhost):(14200|4200)$ $http_origin;
    }
    access_log /dev/stdout;
    client_body_temp_path /tmp/clb_cliente;
    proxy_temp_path /tmp/clb_proxy;
    fastcgi_temp_path /tmp/clb_fastcgi;
    uwsgi_temp_path /tmp/clb_uwsgi;
    scgi_temp_path /tmp/clb_scgi;
    client_max_body_size 1m;

    server {
        listen 8080;
        server_name _;
        add_header Access-Control-Allow-Origin $clb_origen_probador always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-store" always;

        # Resuelve otra vez los servicios de Compose si se recrean (p. ej., la demo de caída de Clientes).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $inventario http://inventario:8000;
        set $ventas http://ventas:8080;
        set $clientes http://clientes:3000;
        set $identidad http://identidad:8080;
        set $ia http://ia:8000;
        set $vton http://ia-vton:8000;

        # Los parámetros de ruta (;) permiten que un backend interprete una ruta distinta a la que vio la pasarela.
        if ($request_uri ~ ";") {
            return 400;
        }

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # La pasarela es el borde: se sobrescribe la IP de origen en vez de confiar en la que mande el cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;

        location = /salud {
            default_type application/json;
            return 200 '{"estado":"ACTIVO","servicio":"pasarela"}';
        }

        # Salud de cada servicio por la entrada única (operación y demos), sin publicar sus puertos.
        location = /salud/inventario { proxy_pass $inventario/salud; }
        location = /salud/ventas { proxy_pass $ventas/salud; }
        location = /salud/clientes { proxy_pass $clientes/salud; }
        location = /salud/ia { proxy_pass $ia/salud; }
        location = /salud/probador { proxy_pass $vton/salud; }

        location ^~ /api/v1/probador/ {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass $vton$uri$is_args$args;
            client_max_body_size 18m;
            proxy_read_timeout 30s;
            proxy_intercept_errors on;
            error_page 502 503 504 = @vton_no_disponible;
        }

        location @vton_no_disponible {
            default_type application/json;
            return 503 '{"mensaje":"El motor fotográfico no está disponible. Puedes abrir las imágenes guardadas en este dispositivo.","código":"VTON_NO_DISPONIBLE"}';
        }

        # Se reenvía la ruta ya normalizada ($uri, sin segmentos de punto) con su consulta.
        # La SAGA es síncrona en Ventas y puede reintentar participantes.
        location /api/v1/pedidos {
            proxy_pass $ventas$uri$is_args$args;
            proxy_read_timeout 90s;
        }

        # Gestión empresarial (IA): reportes, agentes, voz, GraphQL, tallas y notificaciones de n8n. El MCP (/mcp) es interno: no se publica.
        # Si IA está apagada, solo estas rutas fallan; catálogo, compra y SSO siguen igual.
        location ~ ^/api/v1/(reportes|agentes|voz|tallas|graphql|notificaciones)(/|$) {
            proxy_pass $ia$uri$is_args$args;
            proxy_read_timeout 300s;
            client_max_body_size 6m;
        }

        location /api/v1/fidelizacion {
            proxy_pass $clientes$uri$is_args$args;
            proxy_read_timeout 30s;
        }

        location /api/v1/perfiles {
            proxy_pass $clientes$uri$is_args$args;
            proxy_read_timeout 30s;
        }

        # Cierre de sesión sin red en Android: borra el vínculo push probando el secreto de la instalación.
        location /api/v1/dispositivos/ {
            proxy_pass $clientes$uri$is_args$args;
            proxy_read_timeout 30s;
        }

        # Las APIs internas (outbox, reservas, acreditaciones) son solo entre servicios: no se exponen.
        location /api/v1/interno/ {
            default_type application/json;
            return 404 '{"mensaje":"La ruta solicitada no existe.","código":"NO_ENCONTRADO"}';
        }

        location ~ "^/api/v1/productos/[a-f0-9]{32}/recursos-probador(/|$)" {
            client_max_body_size 12m;
            proxy_pass $inventario$uri$is_args$args;
            proxy_read_timeout 30s;
        }

        location /api/ {
            proxy_pass $inventario$uri$is_args$args;
            proxy_read_timeout 30s;
        }

        # La consola de administración y el realm master de Keycloak no se publican (se administra con kcadm).
        location /identidad/admin {
            return 404;
        }
        location /identidad/realms/master {
            return 404;
        }

        # Keycloak publica su URL (KC_HOSTNAME) bajo /identidad en esta misma entrada.
        # Keycloak ya gestiona sus propias cabeceras CORS para los clientes autorizados (clb-web).
        # Se define cabecera local para no heredar las cabeceras Access-Control del bloque server y evitar duplicados en el navegador.
        location /identidad/ {
            proxy_pass $identidad$uri$is_args$args;
            proxy_read_timeout 30s;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            add_header Cache-Control "no-store" always;
        }

        location / {
            default_type application/json;
            return 404 '{"mensaje":"La ruta solicitada no existe.","código":"NO_ENCONTRADO"}';
        }
    }
}
